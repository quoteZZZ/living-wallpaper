<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Solstice T1.0-B Spike — 双画布：程序化背景 + Babylon 3D 元素</title>
<!--
  T1.0-B spike 第③项：Babylon 载入 GLTF 低模树 + 时辰调色光照 + 风摆
  Canvas A (#gl)  = 现有程序化场景渲染器（kernel.js + composer.js，零改动复用）
  Canvas B (#b3d) = 透明 Babylon 层，只渲染 3D 元素
  ?hour=21.5 可看夜晚调色联动
-->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #b3d{z-index:1}
  #tag{position:fixed;right:10px;bottom:8px;z-index:2;color:rgba(255,255,255,.55);
       font:11px Consolas,monospace;text-shadow:0 1px 2px #000}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="b3d"></canvas>
<div id="tag">T1.0-B spike · dual-canvas</div>

<script src="/app/js/kernel.js"></script>
<script src="/app/js/core/composer.js"></script>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script>
"use strict";
/* ---------- 通道 A：程序化背景（复用，零改动） ---------- */
const K = window.Solstice;
K.S.cards.tree.pref = 'hide';            // spike：隐藏 Canvas A 的程序化树，只验证 Babylon 树
K.composer.run((now, t) => {
  const d = new Date();
  K.ctx.weather = K.S.weather;
  const sun = K.ctx.sunState(d);
  const pal = K.ctx.palette(sun.elev * 180 / Math.PI);
  const st = K.registry.resolveFrame({ date: d, sun, pal, aspect: K.composer.aspect });
  window.__pal = st.pal;                 // 给通道 B 的光照
  window.__night = st.night;
  return st;
});

/* ---------- 通道 B：Babylon 透明 3D 元素层 ---------- */
const b3d = document.getElementById('b3d');
const engine = new BABYLON.Engine(b3d, true, { alpha: true, antialias: true,
  premultipliedAlpha: false, preserveDrawingBuffer: true, stencil: false });
engine.setHardwareScalingLevel(1 / Math.min(devicePixelRatio || 1, 1.5));

const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);          // 透明，露出背景画布
scene.autoClear = false;                                     // 保留上帧透明合成
const camera = new BABYLON.FreeCamera('cam', new BABYLON.Vector3(0, 1.25, -3.6), scene);
camera.setTarget(new BABYLON.Vector3(1.35, 0.95, 0));        // 树摆在画面左侧

const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
hemi.intensity = 0.95;
const dir = new BABYLON.DirectionalLight('dir', new BABYLON.Vector3(-0.45, -1, 0.35), scene);
dir.intensity = 0.85;

const SEASON = {
  spring: [0.55, 0.79, 0.56], summer: [0.25, 0.56, 0.31],
  autumn: [0.82, 0.51, 0.23], winter: [0.62, 0.72, 0.78],
};
const C3 = a => new BABYLON.Color3(a[0], a[1], a[2]);

let canopies = [], trunks = [];
BABYLON.SceneLoader.ImportMesh('', '/app/assets/models/', 'tree.glb', scene,
  (meshes) => {
    for (const m of meshes) {
      if (!m.isEnabled()) continue;
      m.convertToFlatShadedMesh();
      const mat = new BABYLON.StandardMaterial('m_' + m.name, scene);
      mat.specularColor = BABYLON.Color3.Black();           // 哑光
      if (m.name.startsWith('canopy')) {
        canopies.push(m);
      } else if (m.name.startsWith('trunk')) {
        mat.diffuseColor = new BABYLON.Color3(0.30, 0.21, 0.17);
        trunks.push({ m, mat });
      }
      m.material = mat;
    }
  },
  null, (e) => console.error('GLB load failed', e));

/* 帧循环：30fps 门控 + 调色板光照 + 风摆 */
let last = 0;
engine.runRenderLoop(() => {
  const now = performance.now();
  if (now - last < 33) return;                              // ~30fps
  last = now;
  const pal = window.__pal, night = window.__night || 0;
  if (pal) {
    dir.diffuse = C3(pal.hor.map(v => Math.min(1, v * 1.15)));
    hemi.diffuse = C3(pal.top);
    hemi.groundColor = C3(pal.top.map(v => v * 0.35));
    const k = 1 - 0.62 * night;                             // 夜晚整体压暗
    dir.intensity = 0.85 * k; hemi.intensity = 0.95 * (1 - 0.45 * night);
    const season = K.ctx.seasonOf(new Date());
    const leaf = C3(SEASON[season].map(v => v * k));
    for (const c of canopies) c.material.diffuseColor = leaf;
    for (const t of trunks)  t.mat.diffuseColor = new BABYLON.Color3(0.30 * k, 0.21 * k, 0.17 * k);
  }
  const ts = now / 1000;
  const gust = Math.sin(ts * 1.25) + 0.4 * Math.sin(ts * 2.9);
  for (const c of canopies) { c.rotation.z = gust * 0.045; c.position.x = gust * 0.02; }
  scene.render();
});

addEventListener('resize', () => engine.resize());
document.title += ' · ok';
</script>
</body>
</html>
