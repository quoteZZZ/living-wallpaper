<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Solstice — 微内核 + 插件化原型</title>
<!--
  Solstice T0.3：微内核 + 官方插件 + 场景编辑器 + 信息组件
  -----------------------------------------------------------------
  文件结构（经典 <script> 顺序加载，零构建、双击可用）：
    js/kernel.js            微内核：i18n/存储/上下文总线/注册表+卡槽仲裁
    js/composer.js          合成器：WebGL2 双通道（全屏程序化 + 前景精灵）
    js/panel.js             设置中心：由插件 settingsGroups 自动生成
    js/editor.js            场景编辑器：选中/拖拽/缩放/右键菜单/工具条（§4.8）
    js/plugins/base.js      official.base      天空光照 + 日月/星空卡 + 界面
    js/plugins/mountains.js official.mountains 山峦卡（程序化→声明式）
    js/plugins/weather.js   official.weather   云/雨/雪/雾效果 + T0 手动天气
    js/plugins/trees.js     pack.trees         前景树素材包（四季变体，贴图卡管线）
    js/plugins/presets.js   official.presets   预设（极简/完整/深夜护眼）
    js/plugins/info.js      official.info      信息组件（时间/天气，可收缩）
    js/main.js              启动装配 + WE/Tauri 属性桥

  URL 参数：?hour=21.5 ?lat=39.9 ?debug=1 ?fps=60 ?par=150 ?ui=0 ?nohid=1
  配置持久化：localStorage "lw.cfg.v1"（v1 平铺键自动迁移）
-->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;
            font:13px/1.5 system-ui,"Noto Sans SC",sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ---- 信息中枢（official.info：唯一悬浮 UI 组件） ---- */
  #infoCard{position:fixed;left:14px;top:14px;z-index:15;display:flex;align-items:flex-start;
       gap:8px;padding:10px 14px;border-radius:14px;color:#eaf2fb;
       background:rgba(8,13,24,.55);border:1px solid rgba(255,255,255,.14);
       backdrop-filter:blur(10px);transform-origin:top left;user-select:none;touch-action:none}
  #infoCard .ic-main{min-width:96px}
  #infoCard .ic-time{font:600 26px/1.1 Consolas,monospace;letter-spacing:1px}
  #infoCard .ic-time .ic-sec{font-size:15px;opacity:.75}
  #infoCard .ic-sub{margin-top:3px;font-size:12px;color:#aebdd2;display:flex;gap:10px}
  #infoCard .ic-dbg{white-space:pre;font:11px/1.55 Consolas,monospace;color:#9fb4cc;
       border-left:1px solid rgba(255,255,255,.15);padding-left:10px;margin-left:2px}
  #infoCard .ic-btns{display:flex;flex-direction:column;gap:4px;margin-left:auto}
  #infoCard .ic-btn{width:24px;height:24px;border-radius:7px;border:1px solid rgba(255,255,255,.16);
       background:rgba(16,24,40,.6);color:#cfe0f2;font-size:13px;cursor:pointer;line-height:1}
  #infoCard .ic-btn:hover{background:rgba(36,52,84,.8)}
  #infoCard .ic-btn.on{background:#2c4a86;border-color:#5b8dd9;color:#fff}
  #infoCard.min{padding:7px 12px;border-radius:999px}
  #infoCard.min .ic-time{font-size:15px}
  #infoCard.min .ic-sub,#infoCard.min .ic-dbg{display:none}
  #infoCard.min .ic-main{min-width:0}
  #infoCard.min .ic-btns{flex-direction:row;margin-left:2px}
  #infoCard.min .ic-btn{width:20px;height:20px;font-size:11px}

  /* ---- 设置中心（panel.js，由信息中枢 ⚙ 呼出） ---- */
  #panel{position:fixed;right:14px;top:14px;z-index:20;width:238px;max-height:calc(100vh - 28px);
         overflow:auto;padding:12px 14px;border-radius:12px;background:rgba(8,13,24,.78);
         border:1px solid rgba(255,255,255,.12);color:#dfe8f4;
         backdrop-filter:blur(10px);display:none}
  #panel.open{display:block}
  #panel .cap{color:#8fa0ba;font-size:12px;font-weight:600;margin:4px 0 2px}
  #panel .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0}
  #panel select{background:#16213a;color:#dfe8f4;border:1px solid #2c3a55;
                border-radius:6px;padding:2px 4px;font:12px system-ui}
  #panel input[type=range]{width:112px;accent-color:#5b8dd9}
  #panel input[type=checkbox]{accent-color:#5b8dd9}
  #panel hr{border:none;border-top:1px solid rgba(255,255,255,.1);margin:9px 0}
  #panel .hint{color:#5c6b84;font-size:11px;line-height:1.5;margin-top:8px}
  #panel .prow{display:flex;gap:6px;margin:2px 0 4px}
  #panel .pbtn{background:#16213a;color:#dfe8f4;border:1px solid #2c3a55;border-radius:6px;
               padding:3px 8px;font:12px system-ui;cursor:pointer}
  #panel .pbtn:hover{background:#24345c;border-color:#4a5f8c}
  #panel .pbtn.wide{flex:1}
  #panel .sec-h{display:flex;justify-content:space-between;align-items:center;cursor:pointer;
                color:#aebdd2;font-weight:600;font-size:12.5px;margin:2px 0;padding:2px 0;
                user-select:none}
  #panel .sec-h:hover{color:#dfe8f4}
  #panel .sec-h i{font-style:normal;color:#5c6b84}
  #panel .sec.fold .sec-b{display:none}

  /* ---- 场景编辑器（editor.js） ---- */
  #gizmo{position:fixed;z-index:18;display:none;pointer-events:none;
         border:1.5px dashed rgba(120,200,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.25) inset}
  #ghost{position:fixed;z-index:17;display:none;pointer-events:none;
         border:1.5px dashed rgba(160,200,240,.35);border-radius:8px}
  #gizmo.thin,#ghost.thin{border-style:dotted;box-shadow:none}
  #gzHandle{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;display:none;
         border-radius:3px;background:#7cf;border:2px solid #fff;cursor:nwse-resize;
         pointer-events:auto;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  #ctxMenu{position:fixed;z-index:30;display:none;min-width:150px;padding:5px;
         border-radius:10px;background:rgba(10,15,26,.92);border:1px solid rgba(255,255,255,.16);
         backdrop-filter:blur(8px)}
  #ctxMenu button{display:block;width:100%;text-align:left;padding:7px 10px;margin:1px 0;
         border:none;border-radius:7px;background:transparent;color:#dfe8f4;
         font:13px system-ui,"Noto Sans SC",sans-serif;cursor:pointer}
  #ctxMenu button:hover{background:rgba(70,110,180,.35)}
  #ctxMenu button.back{color:#8fa0ba;border-bottom:1px solid rgba(255,255,255,.1);
         border-radius:0;margin-bottom:3px}

  /* ---- 圆盘放射菜单（素材/变体/天气/预设选择器） ---- */
  #radial{position:fixed;z-index:40;width:0;height:0}
  #radial .rd-c{position:absolute;left:-34px;top:-34px;width:68px;height:68px;border-radius:50%;
         display:flex;align-items:center;justify-content:center;text-align:center;
         background:rgba(10,15,26,.9);border:1px solid rgba(255,255,255,.2);color:#cfe0f2;
         font:12px system-ui,"Noto Sans SC",sans-serif;cursor:pointer;padding:6px;
         backdrop-filter:blur(8px);box-shadow:0 2px 14px rgba(0,0,0,.45)}
  #radial .rd-i{position:absolute;width:64px;margin-left:-32px;margin-top:-34px;
         display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  #radial .rd-b{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;
         justify-content:center;font-size:21px;background:rgba(14,22,38,.9);
         border:1.5px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);
         box-shadow:0 2px 10px rgba(0,0,0,.4);transition:transform .12s, border-color .12s}
  #radial .rd-i:hover .rd-b{transform:scale(1.14);border-color:#7cb2e8}
  #radial .rd-i.on .rd-b{border-color:#5b8dd9;box-shadow:0 0 0 2px rgba(91,141,217,.55)}
  #radial .rd-l{font:11px system-ui,"Noto Sans SC",sans-serif;color:#dfe8f4;
         background:rgba(8,13,24,.7);padding:1px 7px;border-radius:8px;white-space:nowrap}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="infoHost"></div>
<div id="panel"></div>

<script src="js/kernel.js?v=0.4"></script>
<script src="js/composer.js?v=0.4"></script>
<script src="js/panel.js?v=0.4"></script>
<script src="js/editor.js?v=0.4"></script>
<script src="js/plugins/base.js?v=0.4"></script>
<script src="js/plugins/mountains.js?v=0.4"></script>
<script src="js/plugins/weather.js?v=0.4"></script>
<script src="js/plugins/trees.js?v=0.4"></script>
<script src="js/plugins/presets.js?v=0.4"></script>
<script src="js/plugins/info.js?v=0.4"></script>
<script src="js/main.js?v=0.4"></script>
</body>
</html>
