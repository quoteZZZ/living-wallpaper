; Solstice - input configuration.
;
; The controller polls keys directly (see ASolsticePlayerController::PollInput) because the Slate
; HUD needs the mouse for its own buttons. Action and axis mappings would compete with it, so the
; only thing configured here is that the mouse stays visible and uncaptured, and that the cursor
; can leave the viewport to reach the HUD.

[/Script/Engine.InputSettings]
bAltEnterTogglesFullscreen=True
bCaptureMouseOnLaunch=False
DefaultViewportMouseCaptureMode=NoCapture
DefaultViewportMouseLockMode=DoNotLock
bDefaultViewportMouseLock=False
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent
+ConsoleKeys=Tilde
+ConsoleKeys=Comma
