<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Solstice — 微内核 + 插件化原型</title>
<!--
  Solstice T0.3：微内核 + 官方插件 + 场景编辑器 + 信息组件
  -----------------------------------------------------------------
  文件结构（经典 <script> 顺序加载，零构建、双击可用）：
    js/kernel.js            微内核：i18n/存储/上下文总线/注册表+卡槽仲裁
    js/core/composer.js          合成器：WebGL2 双通道（全屏程序化 + 前景精灵）
    js/ui/panel.js             设置中心：由插件 settingsGroups 自动生成
    js/ui/editor.js            场景编辑器：选中/拖拽/缩放/右键菜单/工具条（§4.8）
    js/plugins/base.js      official.base      天空光照 + 日月/星空卡 + 界面
    js/plugins/mountains.js official.mountains 山峦卡（程序化→声明式）
    js/plugins/weather.js   official.weather   云/雨/雪/雾效果 + T0 手动天气
    js/plugins/trees.js     pack.trees         前景树素材包（四季变体，贴图卡管线）
    js/plugins/presets.js   official.presets   预设（极简/完整/深夜护眼）
    js/plugins/info.js      official.info      信息组件（时间/天气，可收缩）
    js/main.js              启动装配 + WE/Tauri 属性桥

  URL 参数：?hour=21.5 ?lat=39.9 ?debug=1 ?fps=60 ?par=150 ?ui=0 ?nohid=1
  配置持久化：localStorage "lw.cfg.v1"（v1 平铺键自动迁移）
-->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;
            font:13px/1.5 system-ui,"Noto Sans SC",sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

<style>
  :root{ --acc:#5b8dd9; }   /* 主题色实时取自时辰调色板（info.js 写入） */
  html,body{margin:0;height:100%;overflow:hidden;background:#000;
            font:13px/1.5 system-ui,"Noto Sans SC",sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ---- 信息中枢（official.info：唯一悬浮 UI 组件） ---- */
  #infoCard{position:fixed;left:16px;top:16px;z-index:15;display:flex;align-items:stretch;
       gap:12px;padding:12px 14px 12px 18px;border-radius:18px;color:#eef4fb;
       background:rgba(9,14,24,.52);border:1px solid color-mix(in srgb,var(--acc) 32%,rgba(255,255,255,.12));
       backdrop-filter:blur(14px) saturate(1.15);transform-origin:top left;
       user-select:none;touch-action:none;
       box-shadow:0 4px 24px rgba(0,0,0,.25)}
  #infoCard .ic-left{display:flex;flex-direction:column;justify-content:center;min-width:104px}
  #infoCard .ic-time{font:300 31px/1 "Segoe UI",system-ui,sans-serif;
       font-variant-numeric:tabular-nums;letter-spacing:1px;color:#f4f8fd}
  #infoCard .ic-time .ic-sec{font-size:14px;font-weight:300;opacity:.55;margin-left:2px}
  #infoCard .ic-sub{margin-top:5px;font-size:12px;color:#b9c8dc;display:flex;
       align-items:center;gap:6px;letter-spacing:.3px}
  #infoCard .ic-wxico{display:flex;color:var(--acc)}
  #infoCard .ic-dot{font-style:normal;opacity:.45}
  #infoCard .ic-dbg{white-space:pre;font:10.5px/1.6 Consolas,monospace;color:#7e93aa;
       border-left:1px solid rgba(255,255,255,.1);padding-left:12px;align-self:center;
       max-width:300px;overflow:hidden}
  #infoCard .ic-btns{display:flex;flex-direction:column;justify-content:center;gap:5px}
  #infoCard .ic-btn{width:28px;height:28px;border-radius:9px;
       border:1px solid rgba(255,255,255,.13);background:rgba(16,24,40,.35);
       color:#cfe0f2;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  #infoCard .ic-btn svg{display:block}
  #infoCard .ic-btn:hover{border-color:color-mix(in srgb,var(--acc) 65%,rgba(255,255,255,.2));
       background:color-mix(in srgb,var(--acc) 16%,rgba(16,24,40,.5))}
  #infoCard .ic-btn.on{color:var(--acc);border-color:var(--acc);
       background:color-mix(in srgb,var(--acc) 18%,rgba(16,24,40,.4))}
  #infoCard.min{padding:8px 12px 8px 16px;border-radius:999px;gap:10px}
  #infoCard.min .ic-time{font-size:16px}
  #infoCard.min .ic-sub,#infoCard.min .ic-dbg{display:none}
  #infoCard.min .ic-left{min-width:0}
  #infoCard.min .ic-btns{flex-direction:row}
  #infoCard.min .ic-btn{width:22px;height:22px;border-radius:50%}

  /* ---- 设置中心（panel.js，由信息中枢 ⚙ 呼出） ---- */
  #panel{position:fixed;right:14px;top:14px;z-index:20;width:238px;max-height:calc(100vh - 28px);
         overflow:auto;padding:12px 14px;border-radius:12px;background:rgba(8,13,24,.78);
         border:1px solid rgba(255,255,255,.12);color:#dfe8f4;
         backdrop-filter:blur(10px);display:none}
  #panel.open{display:block}
  #panel .cap{color:#8fa0ba;font-size:12px;font-weight:600;margin:4px 0 2px}
  #panel .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0}
  #panel select{background:#16213a;color:#dfe8f4;border:1px solid #2c3a55;
                border-radius:6px;padding:2px 4px;font:12px system-ui}
  #panel input[type=range]{width:112px;accent-color:var(--acc)}
  #panel input[type=checkbox]{accent-color:var(--acc)}
  #panel hr{border:none;border-top:1px solid rgba(255,255,255,.1);margin:9px 0}
  #panel .hint{color:#5c6b84;font-size:11px;line-height:1.5;margin-top:8px}
  #panel .prow{display:flex;gap:6px;margin:2px 0 4px}
  #panel .pbtn{background:rgba(16,24,40,.4);color:#dfe8f4;border:1px solid rgba(255,255,255,.14);
               border-radius:8px;padding:3px 8px;font:12px system-ui;cursor:pointer}
  #panel .pbtn:hover{border-color:var(--acc);
               background:color-mix(in srgb,var(--acc) 16%,rgba(16,24,40,.4))}
  #panel .pbtn.wide{flex:1}
  #panel .sec-h{display:flex;justify-content:space-between;align-items:center;cursor:pointer;
                color:#aebdd2;font-weight:600;font-size:12.5px;margin:2px 0;padding:2px 0;
                user-select:none}
  #panel .sec-h:hover{color:#dfe8f4}
  #panel .sec-h i{font-style:normal;color:#5c6b84}
  #panel .sec.fold .sec-b{display:none}

  /* ---- 场景编辑器（editor.js） ---- */
  #gizmo{position:fixed;z-index:18;display:none;pointer-events:none;
         border:1.5px dashed rgba(120,200,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.25) inset}
  #ghost{position:fixed;z-index:17;display:none;pointer-events:none;
         border:1.5px dashed rgba(160,200,240,.35);border-radius:8px}
  #gizmo.thin,#ghost.thin{border-style:dotted;box-shadow:none}
  #gzHandle{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;display:none;
         border-radius:3px;background:#7cf;border:2px solid #fff;cursor:nwse-resize;
         pointer-events:auto;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  #ctxMenu{position:fixed;z-index:30;display:none;min-width:152px;padding:6px;
         border-radius:12px;background:rgba(10,15,26,.9);border:1px solid rgba(255,255,255,.14);
         backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.35)}
  #ctxMenu button{display:block;width:100%;text-align:left;padding:7px 11px;margin:1px 0;
         border:none;border-radius:8px;background:transparent;color:#dfe8f4;
         font:12.5px system-ui,"Noto Sans SC",sans-serif;letter-spacing:.2px;cursor:pointer}
  #ctxMenu button:hover{background:color-mix(in srgb,var(--acc) 24%,transparent)}
  #ctxMenu button.back{color:#8fa0ba;border-bottom:1px solid rgba(255,255,255,.1);
         border-radius:0;margin-bottom:3px}

  /* ---- 圆盘放射菜单（素材/变体/天气/预设选择器） ---- */
  #radial{position:fixed;z-index:40;width:0;height:0;animation:rdIn .18s ease-out}
  @keyframes rdIn{from{transform:scale(.72);opacity:0}}
  #radial .rd-ring{position:absolute;border:1px dashed rgba(255,255,255,.16);
         border-radius:50%;pointer-events:none}
  #radial .rd-c{position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;
         display:flex;align-items:center;justify-content:center;text-align:center;
         background:rgba(10,15,26,.92);border:1px solid rgba(255,255,255,.22);color:#cfe0f2;
         font:12px/1.25 system-ui,"Noto Sans SC",sans-serif;letter-spacing:1px;cursor:pointer;
         padding:6px;backdrop-filter:blur(10px);box-shadow:0 2px 16px rgba(0,0,0,.45)}
  #radial .rd-c.hint{color:var(--acc);border-color:var(--acc)}
  #radial .rd-i{position:absolute;width:64px;margin-left:-32px;margin-top:-36px;
         display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  #radial .rd-b{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;
         justify-content:center;color:inherit;background:rgba(12,18,32,.9);
         border:1.5px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);
         box-shadow:0 2px 12px rgba(0,0,0,.4);transition:transform .12s, border-color .12s}
  #radial .rd-i:hover .rd-b{transform:scale(1.13);border-color:var(--acc)}
  #radial .rd-i.on .rd-b{border-color:var(--acc);
         box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 45%,transparent)}
  #radial .rd-thumb{width:38px;height:38px;border-radius:9px;
         background-color:rgba(232,238,246,.92);
         background-size:cover;background-position:center bottom;
         box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  #radial .rd-l{font:11px system-ui,"Noto Sans SC",sans-serif;color:rgba(235,243,252,.92);
         text-shadow:0 1px 3px rgba(0,0,0,.9);letter-spacing:.5px;white-space:nowrap}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="infoHost"></div>
<div id="panel"></div>

<script src="js/kernel.js?v=0.4.1"></script>
<script src="js/icons.js?v=0.4.1"></script>
<script src="js/core/composer.js?v=0.4.1"></script>
<script src="js/ui/panel.js?v=0.4.1"></script>
<script src="js/ui/editor.js?v=0.4.1"></script>
<script src="js/plugins/base.js?v=0.4.1"></script>
<script src="js/plugins/mountains.js?v=0.4.1"></script>
<script src="js/plugins/weather.js?v=0.4.1"></script>
<script src="js/plugins/trees.js?v=0.4.1"></script>
<script src="js/plugins/presets.js?v=0.4.1"></script>
<script src="js/plugins/info.js?v=0.4.1"></script>
<script src="js/main.js?v=0.4.1"></script>
</body>
</html>
