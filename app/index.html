<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Solstice — 微内核 + 插件化原型</title>
<!--
  Solstice T0.5：游戏化 UI（纸墨主题）+ Actor 交互实体
  -----------------------------------------------------------------
  文件结构（经典 <script> 顺序加载，零构建、双击可用）：
    js/kernel.js            微内核：i18n/存储/上下文总线/注册表（cards+actors）/场景簿
    js/icons.js             Lucide 图标
    js/core/composer.js          合成器：WebGL2 双通道（全屏程序化 + 前景精灵）
    js/ui/panel.js             设置中心：玩家层 / 开发者层（?debug=1）
    js/ui/editor.js            场景编辑器：选中/拖拽/右键菜单/圆盘（§4.8）
    js/ui/hud.js               游戏 HUD：底部 Dock（注册制）+ 纸签弹出面板
    js/plugins/base.js      official.base      天空光照 + 日月/星空卡
    js/plugins/mountains.js official.mountains 山峦卡（程序化→声明式）
    js/plugins/weather.js   official.weather   云/雨/雪/雾效果 + T0 手动天气
    js/plugins/trees.js     pack.trees         前景树素材包（四季变体，贴图卡管线）
    js/plugins/horses.js    official.horses    马群 Actor（漫步/奔跑/点击回应）
    js/plugins/presets.js   official.presets   预设（极简/完整/深夜护眼）
    js/plugins/info.js      official.info      信息纸签（时间/天气，右下角）
    js/main.js              启动装配 + WE/Tauri 属性桥

  URL 参数：?hour=21.5 ?lat=39.9 ?debug=1 ?fps=60 ?par=150 ?ui=0 ?nohid=1
  配置持久化：localStorage "lw.cfg.v1"（v1 平铺键自动迁移）
-->
<style>
  :root{
    /* 纸墨主题令牌（昼）——与 M1 简笔画场景同一视觉语言（DESIGN §1.2） */
    --paper:rgba(251,246,234,.94); --paper-2:rgba(243,235,217,.96);
    --ink:#3a342c; --ink-soft:rgba(58,52,44,.60); --ink-faint:rgba(58,52,44,.28);
    --seal:#b5432f; --acc:#5b8dd9;
    --shadow:0 6px 24px rgba(48,38,20,.16);
  }
  body.night{
    --paper:rgba(30,38,58,.94); --paper-2:rgba(35,44,68,.96);
    --ink:#dee8f5; --ink-soft:rgba(222,232,245,.60); --ink-faint:rgba(222,232,245,.26);
    --seal:#d46a55;
    --shadow:0 6px 24px rgba(0,0,5,.45);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#000;
            font:13px/1.5 system-ui,"Noto Sans SC",sans-serif;color:var(--ink)}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  canvas#actors{position:fixed;inset:0;width:100%;height:100%;display:block;
                z-index:2;pointer-events:none}

  /* ---- 纸面浮层通用（衬线标题 + 墨线描边 + 印章红点缀） ---- */
  #infoCard,#panel,#ctxMenu,#hudPop,.rd-c,.rd-b,.dk-b{
    transition:background-color .8s,color .8s,border-color .8s,box-shadow .8s}
  .pp-cap,#panel .cap{font-family:"Noto Serif SC","Source Han Serif SC","STZhongsong",serif}

  /* ---- 信息纸签（official.info：时间/天气，右下角） ---- */
  #infoCard{position:fixed;right:16px;bottom:86px;z-index:40;display:flex;align-items:stretch;
       gap:12px;padding:10px 12px 10px 16px;border-radius:16px;color:var(--ink);
       background:var(--paper);border:1.5px solid var(--ink-faint);
       backdrop-filter:blur(8px);transform-origin:bottom right;
       user-select:none;touch-action:none;box-shadow:var(--shadow)}
  #infoCard .ic-left{display:flex;flex-direction:column;justify-content:center;min-width:104px}
  #infoCard .ic-time{font:300 30px/1 "Noto Serif SC","STZhongsong",serif;
       font-variant-numeric:tabular-nums;letter-spacing:1px;color:var(--ink)}
  #infoCard .ic-time .ic-sec{font-size:14px;opacity:.55;margin-left:2px}
  #infoCard .ic-sub{margin-top:5px;font-size:12px;color:var(--ink-soft);display:flex;
       align-items:center;gap:6px;letter-spacing:.3px}
  #infoCard .ic-wxico{display:flex;color:var(--seal)}
  #infoCard .ic-dot{font-style:normal;opacity:.45}
  #infoCard .ic-dbg{white-space:pre;font:10.5px/1.6 Consolas,monospace;color:var(--ink-soft);
       border-left:1px solid var(--ink-faint);padding-left:12px;align-self:center;
       max-width:300px;overflow:hidden}
  #infoCard .ic-btns{display:flex;flex-direction:column;justify-content:center;gap:5px}
  #infoCard .ic-btn{width:28px;height:28px;border-radius:50%;
       border:1.5px solid var(--ink-faint);background:transparent;
       color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  #infoCard .ic-btn svg{display:block}
  #infoCard .ic-btn:hover{border-color:var(--seal);color:var(--seal)}
  #infoCard.min{padding:8px 14px;border-radius:999px;gap:10px}
  #infoCard.min .ic-time{font-size:16px}
  #infoCard.min .ic-sub,#infoCard.min .ic-dbg{display:none}
  #infoCard.min .ic-left{min-width:0}
  #infoCard.min .ic-btns{flex-direction:row}
  #infoCard.min .ic-btn{width:22px;height:22px}

  /* ---- 游戏 HUD：底部 Dock ---- */
  #dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;
        display:flex;gap:6px;padding:6px;border-radius:18px;
        background:var(--paper);border:1.5px solid var(--ink-faint);
        box-shadow:var(--shadow);backdrop-filter:blur(8px)}
  .dk-b{width:44px;height:44px;border-radius:13px;border:1.5px solid transparent;
        background:transparent;color:var(--ink);cursor:pointer;
        display:flex;align-items:center;justify-content:center;padding:0;position:relative}
  .dk-b:hover{border-color:var(--ink-faint);background:var(--paper-2)}
  .dk-b.on{border-color:var(--seal);color:var(--seal)}
  .dk-b.on::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
        width:5px;height:5px;border-radius:50%;background:var(--seal)}

  /* ---- HUD 纸签弹出面板 ---- */
  #hudPop{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(6px);z-index:55;
        min-width:230px;max-width:min(430px,92vw);padding:12px 14px;border-radius:16px;
        background:var(--paper);border:1.5px solid var(--ink-faint);
        box-shadow:var(--shadow);backdrop-filter:blur(8px);
        opacity:0;pointer-events:none;transition:opacity .16s,transform .16s,background-color .8s,border-color .8s}
  #hudPop.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  .pp-cap{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;
        letter-spacing:2px;margin-bottom:9px}
  .pp-cap i{width:8px;height:8px;background:var(--seal);border-radius:2px;flex:none}
  .pp-row{display:flex;align-items:center;gap:8px;margin:8px 0 2px}
  .pp-row input[type=range]{flex:1;accent-color:var(--seal)}
  .pp-val{font:12px Consolas,monospace;color:var(--ink-soft);min-width:38px;text-align:right}
  .pp-chips{display:flex;gap:6px;flex-wrap:wrap}
  .pp-chip{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:10px;
        border:1.5px solid var(--ink-faint);background:transparent;color:var(--ink);
        font:12px system-ui,"Noto Sans SC",sans-serif;cursor:pointer}
  .pp-chip:hover{background:var(--paper-2)}
  .pp-chip.on{border-color:var(--seal);color:var(--seal)}
  .pp-grp{margin-top:8px}
  .pp-grp-t{font-size:11px;color:var(--ink-soft);letter-spacing:2px;margin:6px 0 4px}
  .pp-shelf{display:flex;flex-direction:column;align-items:center;gap:3px;width:60px;
        padding:7px 0;border-radius:12px;border:1.5px solid var(--ink-faint);
        background:transparent;color:var(--ink);font:11px system-ui;cursor:pointer}
  .pp-shelf:hover{background:var(--paper-2)}
  .pp-shelf.on{border-color:var(--seal);color:var(--seal)}
  .pp-shelf span{transform:scale(.92)}
  .pp-grp .pp-shelf{display:inline-flex;margin-right:6px}
  .pp-leaf{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink-faint);
        background-color:var(--paper-2);background-size:cover;background-position:center bottom;
        color:var(--ink);cursor:pointer;padding:0;display:inline-flex;
        align-items:center;justify-content:center;margin-right:6px}
  .pp-leaf:hover{border-color:var(--ink-soft)}
  .pp-leaf.on{border-color:var(--seal);box-shadow:0 0 0 2px color-mix(in srgb,var(--seal) 40%,transparent)}
  .pp-scenes{display:flex;flex-direction:column;gap:6px}
  .pp-slot{display:flex;align-items:center;gap:6px}
  .pp-slot-n{flex:1;font-size:12px;color:var(--ink-soft)}
  .pp-slot-b{padding:3px 9px;border-radius:8px;border:1.5px solid var(--ink-faint);
        background:transparent;color:var(--ink);font:12px system-ui;cursor:pointer}
  .pp-slot-b:hover:not(:disabled){border-color:var(--seal);color:var(--seal)}
  .pp-slot-b:disabled{opacity:.35;cursor:default}

  /* ---- 设置中心（panel.js：玩家层；开发者层仅 ?debug=1） ---- */
  #panel{position:fixed;right:14px;top:14px;z-index:60;width:242px;max-height:calc(100vh - 28px);
         overflow:auto;padding:12px 14px;border-radius:14px;background:var(--paper);
         border:1.5px solid var(--ink-faint);color:var(--ink);
         backdrop-filter:blur(8px);box-shadow:var(--shadow);display:none}
  #panel.open{display:block}
  #panel .cap{color:var(--ink-soft);font-size:12px;font-weight:600;margin:4px 0 2px;letter-spacing:1px}
  #panel .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0}
  #panel select{background:var(--paper-2);color:var(--ink);border:1px solid var(--ink-faint);
                border-radius:6px;padding:2px 4px;font:12px system-ui}
  #panel input[type=range]{width:112px;accent-color:var(--seal)}
  #panel input[type=checkbox]{accent-color:var(--seal)}
  #panel hr{border:none;border-top:1px solid var(--ink-faint);margin:9px 0}
  #panel .hint{color:var(--ink-soft);font-size:11px;line-height:1.5;margin-top:8px}
  #panel .prow{display:flex;gap:6px;margin:2px 0 4px}
  #panel .pbtn{background:transparent;color:var(--ink);border:1.5px solid var(--ink-faint);
               border-radius:8px;padding:3px 8px;font:12px system-ui;cursor:pointer}
  #panel .pbtn:hover{border-color:var(--seal);color:var(--seal)}
  #panel .pbtn.wide{flex:1}
  #panel .sec-h{display:flex;justify-content:space-between;align-items:center;cursor:pointer;
                color:var(--ink);font-weight:600;font-size:12.5px;margin:2px 0;padding:2px 0;
                user-select:none}
  #panel .sec-h:hover{color:var(--seal)}
  #panel .sec-h i{font-style:normal;color:var(--ink-soft)}
  #panel .sec.fold .sec-b{display:none}

  /* ---- 场景编辑器（editor.js，墨线 gizmo + 印红手柄） ---- */
  #gizmo{position:fixed;z-index:18;display:none;pointer-events:none;
         border:1.5px dashed var(--ink);box-shadow:0 0 0 1px rgba(0,0,0,.15) inset}
  #ghost{position:fixed;z-index:17;display:none;pointer-events:none;
         border:1.5px dashed var(--ink-faint);border-radius:8px}
  #gizmo.thin,#ghost.thin{border-style:dotted;box-shadow:none}
  #gzHandle{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;display:none;
         border-radius:4px;background:var(--seal);border:2px solid var(--paper);cursor:nwse-resize;
         pointer-events:auto;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  #ctxMenu{position:fixed;z-index:70;display:none;min-width:152px;padding:6px;
         border-radius:12px;background:var(--paper);border:1.5px solid var(--ink-faint);
         backdrop-filter:blur(8px);box-shadow:var(--shadow)}
  #ctxMenu button{display:block;width:100%;text-align:left;padding:7px 11px;margin:1px 0;
         border:none;border-radius:8px;background:transparent;color:var(--ink);
         font:12.5px system-ui,"Noto Sans SC",sans-serif;letter-spacing:.2px;cursor:pointer}
  #ctxMenu button:hover{background:var(--paper-2);color:var(--seal)}
  #ctxMenu button.back{color:var(--ink-soft);border-bottom:1px solid var(--ink-faint);
         border-radius:0;margin-bottom:3px}

  /* ---- 圆盘放射菜单（素材/变体/天气/预设选择器） ---- */
  #radial{position:fixed;z-index:80;width:0;height:0;animation:rdIn .18s ease-out}
  @keyframes rdIn{from{transform:scale(.72);opacity:0}}
  #radial .rd-ring{position:absolute;border:1px dashed var(--ink-faint);
         border-radius:50%;pointer-events:none}
  #radial .rd-c{position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;
         display:flex;align-items:center;justify-content:center;text-align:center;
         background:var(--paper);border:1.5px solid var(--ink-faint);color:var(--ink);
         font:12px/1.25 "Noto Serif SC",serif;letter-spacing:1px;cursor:pointer;
         padding:6px;backdrop-filter:blur(8px);box-shadow:var(--shadow)}
  #radial .rd-c.hint{color:var(--seal);border-color:var(--seal)}
  #radial .rd-i{position:absolute;width:64px;margin-left:-32px;margin-top:-36px;
         display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  #radial .rd-b{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;
         justify-content:center;color:var(--ink);background:var(--paper);
         border:1.5px solid var(--ink-faint);backdrop-filter:blur(8px);
         box-shadow:var(--shadow);transition:transform .12s, border-color .12s}
  #radial .rd-i:hover .rd-b{transform:scale(1.13);border-color:var(--seal);color:var(--seal)}
  #radial .rd-i.on .rd-b{border-color:var(--seal);color:var(--seal);
         box-shadow:0 0 0 2px color-mix(in srgb,var(--seal) 45%,transparent)}
  #radial .rd-thumb{width:38px;height:38px;border-radius:9px;
         background-color:var(--paper-2);
         background-size:cover;background-position:center bottom;
         box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
  #radial .rd-l{font:11px system-ui,"Noto Sans SC",sans-serif;color:var(--ink);
         text-shadow:0 1px 3px rgba(255,250,240,.5);letter-spacing:.5px;white-space:nowrap}
  body.night #radial .rd-l{text-shadow:0 1px 3px rgba(0,0,10,.9)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="panel"></div>

<script src="js/kernel.js?v=0.5.0"></script>
<script src="js/icons.js?v=0.5.0"></script>
<script src="js/core/composer.js?v=0.5.0"></script>
<script src="js/ui/panel.js?v=0.5.0"></script>
<script src="js/ui/editor.js?v=0.5.0"></script>
<script src="js/ui/hud.js?v=0.5.0"></script>
<script src="js/plugins/base.js?v=0.5.0"></script>
<script src="js/plugins/mountains.js?v=0.5.0"></script>
<script src="js/plugins/weather.js?v=0.5.0"></script>
<script src="js/plugins/trees.js?v=0.5.0"></script>
<script src="js/plugins/horses.js?v=0.5.0"></script>
<script src="js/plugins/presets.js?v=0.5.0"></script>
<script src="js/plugins/info.js?v=0.5.0"></script>
<script src="js/main.js?v=0.5.0"></script>
</body>
</html>
