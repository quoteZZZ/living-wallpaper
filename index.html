  <h1>Living Wallpaper</h1>
  <p class="lead">

    深度视差 · 精灵宠物（开发中）。AI 仅用于离线生成素材，运行时零 AI 调用。
    当前为 T0 程序化占位场景，正式素材接入后自动切换"图片 + 深度图"视差模式。
  </p>
  <div class="links">
